name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # reused as the gate by deploy.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate agent model pins
        run: npm run agents:check

      - name: Lead relay self-check
        run: node workers/lead-relay/test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Generate static site
        run: npm run generate

      # ADR-6: the bot token and the Telegram API host must never reach the static output.
      - name: Check static output for Telegram secrets
        run: |
          test -d .output/public || { echo "::error::.output/public missing"; exit 1; }
          if grep -rEl 'bot[0-9]{6,}:|[0-9]{8,10}:[A-Za-z0-9_-]{30,}|api\.telegram\.org' .output/public; then
            echo "::error::Telegram token or API host found in .output/public"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
